<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        .div1 #name{
            color: crimson;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            font-size: larger;
            font-display: auto;
        }

        .div2 #role{
            
            background-color: yellow;
            color: black;
            font-family: 'Times New Roman', Times, serif;
            padding: 4px 8px;
            border-radius: 6px;
        }

        .div3 .insta, .div3 #youtube{
            
            text-decoration: underline;
            border-radius: 6px;
            padding: 8px;
            
        }

        .div3{
            display: flex;
            gap: 15px;
        }

        .div3 #youtube {
              color: red;
         }

         .div3 .insta {
          color: coral;
      }
    </style>
</head>
<body>
    <div class="div1">
    <h1>Hii this is <span id="name">Vaishali..!</span></h1>
    </div>

     <div class="div2">
    <h1>I am a <mark id="role">Full Stack .NET Developer.</mark></h1>
    </div>

    <div class="div3">
        <h3>
       <a href="https://www.instagram.com/vaishalidesai492" target="_blank"><span class="insta">
    <img src="instagram icon.png" alt="insta" width="50" title="Instagram"></span></a>
       
     </h3>

        <h3>
       <a href="https://www.youtube.com/TEDx Talks" target="_blank"><span id="youtube">
    <img src="You Tube Icon.jpg" alt="youtube" width="60" height="50" title="YouTube"></span></a>
       
       </h3>
    </div>
</body>
</html>
